<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripDrop</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <form id="trip-form">
      <input
        type="text"
        id="trip-name"
        placeholder="Trip name"
        autocomplete="off"
      />
      <!-- <input type="text" id="trip-destination" placeholder="Destination" /> -->
      <div class="search-wrap">
        <input
          type="text"
          id="trip-destination"
          placeholder="Search country..."
          autocomplete="off"
          name="trip-destination-search"
        />
        <!-- <button type="button" id="dest-search-btn">Search</button> -->
        <ul id="dest-results" class="search-results"></ul>
      </div>
      <input type="date" id="trip-start" />
      <input type="date" id="trip-end" />
      <button type="submit">Add trip</button>
    </form>
    <p id="trip-form-error" class="form-error"></p>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
