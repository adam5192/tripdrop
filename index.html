<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripDrop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="src/style.css" />
    <script>
      // apply saved theme before first paint to avoid a flash of the wrong theme
      (function () {
        if (localStorage.getItem("tripdrop-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">TripDrop</h1>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <svg
            class="icon-sun"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg
            class="icon-moon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <div id="auth-area" class="auth-area">
          <!-- filled by JS depending on auth state -->
        </div>
      </div>
    </header>
    <form id="trip-form">
      <input type="text" id="trip-name" placeholder="Trip name" autocomplete="off" />
      <!-- <input type="text" id="trip-destination" placeholder="Destination" /> -->
      <div class="search-wrap">
        <input
          type="text"
          id="trip-destination"
          placeholder="Search country..."
          autocomplete="off"
          name="trip-destination-search"
        />
        <!-- <button type="button" id="dest-search-btn">Search</button> -->
        <ul id="dest-results" class="search-results"></ul>
      </div>
      <input type="date" id="trip-start" />
      <input type="date" id="trip-end" />
      <button type="submit">Add trip</button>
    </form>
    <p id="trip-form-error" class="form-error"></p>

    <div id="app"></div>
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal">
        <p id="modal-message" class="modal__message"></p>
        <div class="modal__actions">
          <button id="modal-cancel" class="modal__cancel">Cancel</button>
          <button id="modal-confirm" class="modal__confirm">Delete</button>
        </div>
      </div>
    </div>
    <div id="auth-modal" class="modal-overlay hidden">
      <div class="modal">
        <h2 id="auth-modal-title">Sign in</h2>
        <input type="email" id="auth-email" placeholder="Email" autocomplete="off" />
        <input type="password" id="auth-password" placeholder="Password" autocomplete="off" />
        <p id="auth-error" class="form-error"></p>
        <div class="modal__actions">
          <button id="auth-cancel" class="modal__cancel">Cancel</button>
          <button id="auth-submit" class="modal__confirm modal__confirm--primary">Sign in</button>
        </div>
        <div class="auth-divider"><span>or</span></div>
        <button id="google-signin" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path
              fill="#4285F4"
              d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"
            />
            <path
              fill="#34A853"
              d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 0 0 9 18z"
            />
            <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.01-2.34z" />
            <path
              fill="#EA4335"
              d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.94l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"
            />
          </svg>
          Continue with Google
        </button>
        <p class="auth-toggle">
          <span id="auth-toggle">
            <span id="auth-toggle-text">Don't have an account?</span>
            <button id="auth-toggle-btn" class="link-btn">Sign up</button>
          </span>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
